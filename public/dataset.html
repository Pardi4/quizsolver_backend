<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parser Dataset Analysis</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    h1 { margin-top: 0; }
    .table-wrap { overflow-x: auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #334155; }
    th { background: #0f172a; font-weight: 600; }
    tr:hover { background: #334155; }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #2563eb; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; padding: 20px; overflow-y: auto; }
    .modal-content { background: #1e293b; max-width: 1200px; margin: 0 auto; padding: 24px; border-radius: 8px; position: relative; }
    .close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    pre { background: #0f172a; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; font-size: 12px; }
    img { max-width: 300px; border: 1px solid #334155; border-radius: 4px; margin: 5px; }
  </style>
</head>
<body>
  <h1>Parser Dataset Viewer</h1>
  <div class="table-wrap">
    <table id="data-table">
      <thead><tr><th>Time</th><th>URL</th><th>Platform</th><th>Outcome</th><th>Questions</th><th>Images</th><th>Action</th></tr></thead>
      <tbody><tr><td colspan="7">Loading...</td></tr></tbody>
    </table>
  </div>

  <div id="modal">
    <div class="modal-content">
      <button class="close" onclick="document.getElementById('modal').style.display='none'">&times;</button>
      <h2>Dataset Entry Details</h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    let dataset = [];
    
    async function loadData() {
      try {
        const res = await fetch('/api/admin/dataset'); // Assuming this endpoint works without auth for iframe inside admin, or uses cookies
        // Wait, the API requires a Bearer token! We need to handle this.
        // Actually, if loaded inside iframe, it won't have the token in fetch unless we pass it.
        // Let's grab it from localStorage if possible.
        const token = localStorage.getItem('qs_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        
        const response = await fetch('/api/admin/dataset', { headers });
        if(!response.ok) throw new Error('Unauthorized or network error');
        dataset = await response.json();
        
        const tbody = document.querySelector('#data-table tbody');
        if (!dataset.length) {
          tbody.innerHTML = '<tr><td colspan="7">No data available yet.</td></tr>';
          return;
        }
        
        tbody.innerHTML = dataset.map((d, i) => `
          <tr>
            <td>${new Date(d.timestamp).toLocaleString()}</td>
            <td><a href="${d.url}" target="_blank">${d.url}</a></td>
            <td>${d.platform || 'universal'}</td>
            <td>${d.outcome || 'empty'}</td>
            <td>${d.snapshot?.questionsData?.length || 0}</td>
            <td>${d.snapshot?.pageImages?.length || 0}</td>
            <td><button class="btn" onclick="showDetails(${i})">View Details</button></td>
          </tr>
        `).join('');
      } catch (err) {
        document.querySelector('#data-table tbody').innerHTML = `<tr><td colspan="7" style="color:#ef4444">Error loading dataset: ${err.message}. Ensure you are logged into the Admin Panel.</td></tr>`;
      }
    }

    window.showDetails = (idx) => {
      const d = dataset[idx];
      const body = document.getElementById('modal-body');
      
      let html = `<h3>URL: <a href="${d.url}" target="_blank">${d.url}</a></h3>`;
      if(d.error) html += `<p style="color:#ef4444">Error: ${d.error}</p>`;
      
      html += `<h4>Questions Found (${d.snapshot?.questionsData?.length || 0})</h4>`;
      if (d.snapshot?.questionsData) {
        d.snapshot.questionsData.forEach((q, i) => {
          html += `
            <div style="background:#0f172a; padding:16px; border-radius:8px; margin-bottom:16px;">
              <h5>Q${i+1} (${q.type})</h5>
              <p><strong>Text:</strong> ${q.text}</p>
              <p><strong>Options:</strong> ${q.options ? q.options.join(' | ') : 'None'}</p>
              ${q.imageUrl ? `<img src="${q.imageUrl}" />` : ''}
              <details><summary>View Container HTML (${(q.containerHtml || '').length} chars)</summary>
                <pre>${(q.containerHtml || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
              </details>
            </div>
          `;
        });
      }
      
      html += `<h4>Page Images (${d.snapshot?.pageImages?.length || 0})</h4><div>`;
      if (d.snapshot?.pageImages) {
        d.snapshot.pageImages.forEach(img => {
          html += `<img src="${img.src}" title="${img.alt || 'image'}" />`;
        });
      }
      html += `</div>`;
      
      body.innerHTML = html;
      document.getElementById('modal').style.display = 'block';
    };

    loadData();
  </script>
</body>
</html>
